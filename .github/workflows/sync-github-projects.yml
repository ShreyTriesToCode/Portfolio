name: Sync GitHub Projects

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync portfolio projects
        run: npm run sync:github-projects
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PORTFOLIO_GH_TOKEN: ${{ secrets.PORTFOLIO_GH_TOKEN }}
          PORTFOLIO_GITHUB_OWNER: ${{ vars.PORTFOLIO_GITHUB_OWNER }}
          PORTFOLIO_TOPIC: ${{ vars.PORTFOLIO_TOPIC }}
          PORTFOLIO_CONFIG_FILE: ${{ vars.PORTFOLIO_CONFIG_FILE }}
